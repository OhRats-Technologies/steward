<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Steward">
  <defs>
    <clipPath id="frameClip">
      <rect width="1200" height="320" rx="16" ry="16" />
    </clipPath>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1EFE7" />
      <stop offset="50%" stop-color="#EEEDE5" />
      <stop offset="100%" stop-color="#EAE7DD" />
    </linearGradient>

    <radialGradient id="warmLeft" cx="16%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#624A3A" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#EEEDE5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="warmRight" cx="84%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#B87B4B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#EEEDE5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="titleCushion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEEDE5" stop-opacity="0.92" />
      <stop offset="70%" stop-color="#EEEDE5" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#EEEDE5" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#624A3A" />
      <stop offset="48%" stop-color="#8C7662" />
      <stop offset="100%" stop-color="#B87B4B" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D1D1B" />
      <stop offset="42%" stop-color="#624A3A" />
      <stop offset="100%" stop-color="#B87B4B" />
    </linearGradient>

    <pattern id="graphGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#DDD8CC" stroke-width="0.8" />
    </pattern>
  </defs>


          filter="url(#textGlow)">steward</text>

    <!-- Signature glowing gradient underline -->
    <rect x="445" y="180" width="310" height="4" rx="2" fill="url(#accentBar)" opacity="0.55" filter="url(#barGlow)" />
    <rect x="445" y="180" width="310" height="3.5" rx="1.75" fill="url(#accentBar)" />


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Steward">
  <defs>
    <clipPath id="frameClip">
      <rect width="1200" height="320" rx="16" ry="16" />
    </clipPath>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e17" />
      <stop offset="48%" stop-color="#0d1524" />
      <stop offset="100%" stop-color="#0a1019" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="16%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080e17" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0d1524" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="84%" cy="52%" r="36%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.17" />
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0a1019" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="titleBack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a111e" stop-opacity="0.86" />
      <stop offset="68%" stop-color="#0a111e" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#0a111e" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="32%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="82%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="45%" stop-color="#60a5fa" />
      <stop offset="72%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="shieldArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="orchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#94a3b8" opacity="0.14" />
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="barGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>

    <filter id="textGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.55
                0 0 0 0 0.72
                0 0 0 0 0.98
                0 0 0 0.30 0" result="tinted" />
      <feMerge>
        <feMergeNode in="tinted" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

